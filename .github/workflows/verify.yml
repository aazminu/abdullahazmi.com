name: Verify Portfolio & CGAS Lab Portal

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: HTML, JSON-LD, Sitemap, Assets & Repo Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run portfolio verification suite
        run: node --test tests/portfolio.test.mjs
